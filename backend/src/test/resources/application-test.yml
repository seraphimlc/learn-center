
spring:
  datasource:
    url: jdbc:h2:mem:vlp;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
  autoconfigure:
    exclude: []
vlp:
  jwt:
    secret: TestJwtSecretKeyMustBeLongEnoughForHs256AlgorithmXX
    expire-hours: 2
  upload:
    dir: /tmp/vlp-test-uploads
    allowed-video: mp4,webm
    allowed-image: jpg,png
  cors:
    origins: http://localhost:5173
  llm:
    base-url: http://127.0.0.1:9/v1
    api-key: ""
    model: test

  auth:
    public-reset-enabled: true
