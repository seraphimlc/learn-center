services:
  mysql:
    image: mysql:8.0
    container_name: vlp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: video_learning
      MYSQL_USER: vlp
      MYSQL_PASSWORD: vlp123
    ports:
      - "3306:3306"
    volumes:
      - vlp_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: vlp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vlp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  vlp_mysql_data:
  vlp_redis_data:
